<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リワード広告（仮組み）の動作見本</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #f6f3ee; color: #333; text-align: center; padding: 40px 16px; }
  button { font-size: 18px; padding: 14px 28px; border-radius: 999px; border: 0; background: #2e7d32; color: #fff; font-weight: bold; }
  #coins { font-size: 28px; margin: 24px 0; }
  #log { font-size: 14px; color: #666; }
</style>
</head>
<body>
<h1 style="font-size:20px">リワード広告（仮組み）の動作見本</h1>
<p id="coins">コイン：<span id="n">0</span></p>
<button id="watch" type="button">広告を見てコインを10枚もらう</button>
<p id="log"></p>
<script src="reward_ad.js"></script>
<script>
  // 見本ページでは、画像が同じフォルダにあるので場所を変える
  RewardAd.config.imageSrc = "house_ad.jpg";
  var coins = 0;
  document.getElementById("watch").addEventListener("click", function () {
    RewardAd.show({
      onReward: function () { coins += 10; document.getElementById("n").textContent = coins; },
      onClose: function (rewarded) {
        document.getElementById("log").textContent = rewarded ? "報酬をもらいました" : "途中で閉じたので、報酬はありません";
      }
    });
  });
</script>
</body>
</html>
